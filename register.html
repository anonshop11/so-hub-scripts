<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>SO HUB | ลงทะเบียนผู้ใช้</title>
    <style>
        /* CSS Dark Mode สำหรับหน้า Register */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d0d; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #ecf0f1; }
        .container { background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 188, 212, 0.2), 0 4px 15px rgba(0, 0, 0, 0.8); width: 380px; max-width: 90%; border-top: 5px solid #00bcd4; }
        h2 { text-align: center; color: #ffeb3b; font-size: 2em; margin-bottom: 30px; font-weight: 700; text-shadow: 0 0 5px rgba(255, 235, 59, 0.3); }
        input[type="text"], input[type="password"] { width: 100%; padding: 14px; margin-bottom: 20px; border: 1px solid #333; border-radius: 6px; box-sizing: border-box; font-size: 16px; background-color: #282828; color: #ecf0f1; transition: border-color 0.3s, box-shadow 0.3s; }
        input[type="text"]:focus, input[type="password"]:focus { border-color: #00bcd4; box-shadow: 0 0 8px rgba(0, 188, 212, 0.5); outline: none; }
        button { width: 100%; padding: 14px; background-color: #00bcd4; color: #1e1e1e; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; transition: background-color 0.3s, transform 0.2s, box-shadow 0.3s; box-shadow: 0 4px 10px rgba(0, 188, 212, 0.4); letter-spacing: 1px; }
        button:hover { background-color: #00a0b0; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 188, 212, 0.6); }
        .login-link { text-align: center; margin-top: 25px; font-size: 16px; color: #999; }
        .login-link a { color: #ff9800; text-decoration: none; font-weight: bold; transition: color 0.3s; }
        .login-link a:hover { color: #ffeb3b; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>สมัครสมาชิก</h2>
        <form action="/register" method="POST"> 
            <input type="text" id="username" name="username" placeholder="ชื่อผู้ใช้" required>
            <input type="password" id="password" name="password" placeholder="รหัสผ่าน" required>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="ยืนยันรหัสผ่าน" required>
            <button type="submit">ลงทะเบียน</button>
        </form>
        <div class="login-link">
            มีบัญชีอยู่แล้ว? <a href="/login">เข้าสู่ระบบ</a>
        </div>
    </div>
</body>
</html>
